# Default values for toolbox.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  serverRepository: docker-registry.ebrains.eu/siibra-toolbox/siibra-jugex-server
  workerRepository: docker-registry.ebrains.eu/siibra-toolbox/siibra-jugex-worker
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  serverTag: ""
  workerTag: ""
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 6001

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

serverResources: 
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

workerResources: 
  limits:
    cpu: 1500m
    memory: 1Gi
  requests:
    cpu: 600m
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: 
- name: log-volume
  persistentVolumeClaim:
    claimName: log-volume-claim
- name: data-volume
  persistentVolumeClaim:
    claimName: data-volume-claim

# Additional volumeMounts on the output Deployment definition.
volumeMounts: 
- mountPath: /siibra-tool-log
  name: log-volume
- mountPath: /siibra-tool-data
  name: data-volume

nodeSelector: {}

tolerations: []

affinity: {}

envObj: {}