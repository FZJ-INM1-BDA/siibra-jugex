name: '[docker image]'

on:
  push:
    branches:
    - feat_workerFrontend
  # release:
  #   types:
  #   - published

jobs:
  build-docker-img:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        dockerfile: ['./http.server.dockerfile', './http.worker.dockerfile']
        include:
        - dockerfile: ./http.server.dockerfile
          dockerimg: siibra-jugex-server
        - dockerfile: ./http.worker.dockerfile
          dockerimg: siibra-jugex-worker
    steps:
    - uses: actions/checkout@v2
    - name: 'Setup tags'
      run: |
        VERSION=$(grep -Po '^__version__.*?"\K[\w.]+' http_wrapper/__init__.py)
        echo "Setting version to $VERSION"
        echo "VERSION=$VERSION" >> $GITHUB_ENV

        DOCKER_IMGSTREAM=${{ secrets.EBRAINS_DOCKER_REG_SIIBRA_TOOLBOX_NSP }}/${{ matrix.dockerimg }}
        echo "Setting docker image stream to $DOCKER_IMGSTREAM"
        echo "DOCKER_IMGSTREAM=$DOCKER_IMGSTREAM" >> $GITHUB_ENV

    - name: 'Build docker image'
      run: |
        DOCKER_BUILT_TAG=$DOCKER_IMGSTREAM:$VERSION
        echo "Building $DOCKER_BUILT_TAG"
        docker build \
          -t $DOCKER_BUILT_TAG \
          -f ${{ matrix.dockerfile }} \
          .
        echo "Successfully built $DOCKER_BUILT_TAG"
        echo "DOCKER_BUILT_TAG=$DOCKER_BUILT_TAG" >> $GITHUB_ENV

    - name: 'Push to docker registry'
      run: |
        echo "curl first otherwise docker login result in tls handshake timeout"
        curl -v https://docker-registry.ebrains.eu/v2/

        echo "Login to docker registry"
        docker login \
          -u '${{ secrets.EBRAINS_DOCKER_REG_SIIBRA_TOOLBOX_PUSHER_USER }}' \
          -p '${{ secrets.EBRAINS_DOCKER_REG_SIIBRA_TOOLBOX_PUSHER_PWSD }}' \
          ${{ secrets.EBRAINS_DOCKER_REG }}
        echo "Pushing $DOCKER_BUILT_TAG"
        docker push $DOCKER_BUILT_TAG
    
    - name: 'Tag versioned tag to registry'
      run: |
        echo "curl first otherwise docker login result in tls handshake timeout"
        curl -v https://docker-registry.ebrains.eu/v2/
        
        echo "Login to docker registry"
        docker login \
          -u '${{ secrets.EBRAINS_DOCKER_REG_SIIBRA_TOOLBOX_PUSHER_USER }}' \
          -p '${{ secrets.EBRAINS_DOCKER_REG_SIIBRA_TOOLBOX_PUSHER_PWSD }}' \
          ${{ secrets.EBRAINS_DOCKER_REG }}

        BREAK=5
        while [[ "$VERSION" == *"."* ]]
        do
          if [[ "$BREAK" == "0" ]]
          then
            echo "Fuse broke!"
            exit 1
          fi
          VERSIONED_DOCKERTAG=$DOCKER_IMGSTREAM:$VERSION
          echo "tagging and pushing $VERSIONED_DOCKERTAG"
          docker tag $DOCKER_BUILT_TAG $VERSIONED_DOCKERTAG
          docker push $VERSIONED_DOCKERTAG

          echo "Push successful... Incrementing version & break"
          VERSION=$(echo $VERSION | sed -e 's/\.\w*$//g')
          BREAK=$(( "$BREAK" - 1 ))
        done
        echo "Done"


  deploy-on-ebrains:
    runs-on: ubuntu-latest
    needs: build-docker-img
    steps:
    - uses: actions/checkout@v4
    - name: 'Trigger gitops pipeline'
      run: |
        VERSION=$(grep -Po '^__version__.*?"\K[\w.]+' http_wrapper/__init__.py)
        if [[ -z "$VERSION" ]]
        then
          echo "Version population failed: $VERSION"
          exit 1
        fi
        echo "Deploying jugex version $VERSION"

        JUGEX_FNAME="siibra-toolbox/toolbox/values/jugex.yaml"

        cat > /tmp/jugex-delta.yaml << EOF
        image:
          serverTag: "$VERSION"
          workerTag: "$VERSION"
        EOF

        # filename -> delta file
        declare -A FILES=(
          ["$JUGEX_FNAME"]=/tmp/jugex-delta.yaml
        )

        UPDATE_FILES=$(
          for fname in "${!FILES[@]}"; do
            jq -cn \
              --arg filename "$fname" \
              --arg delta "$(base64 -w 0 "${FILES[$fname]}")" \
              '{filename: $filename, delta: $delta}'
          done | jq -cs '.'
        )

        echo "UPDATE_FILES: $UPDATE_FILES"

        MR_TITLE="siibra-jugex $VERSION"

        curl -fL -X POST \
          --form "token=${{ secrets.JUGIT_SIIBRA_DEPLOY_PIPELINE_TRIGGER_TOKEN }}" \
          --form "ref=main" \
          --form "variables[UPDATE_FILES]=$UPDATE_FILES" \
          --form "variables[MR_TITLE]=$MR_TITLE" \
          "${{ secrets.JUGIT_URL }}/api/v4/projects/${{ secrets.JUGIT_SIIBRA_DEPLOY_PROJECT_ID }}/trigger/pipeline"
